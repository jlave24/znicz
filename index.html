<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Pamiętamy</title>
  <style>
    body {
      margin: 0;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Georgia, serif;
      color: #f5e8d5;
      background: #171923;
    }

    h1 {
      font-size: 38px;
      font-weight: normal;
      margin-bottom: 15px;
    }

    .znicz {
      width: 100px;
      height: 150px;
      margin-top: 85px;
      position: relative;
      border: 3px solid #d9bd91;
      border-radius: 10px;
      background: linear-gradient(90deg, #c8a879, #f0d7ad, #c8a879);
      box-shadow: 0 0 25px #b8783b55;
    }

    .plomien {
      position: absolute;
      width: 34px;
      height: 65px;
      top: -82px;
      left: 33px;
      border-radius: 50% 50% 45% 45%;
      background: linear-gradient(#fff4b0, #ffad35, #ed6324);
      box-shadow: 0 0 22px #ff9d35;
      animation: miganie 1s infinite alternate;
    }

    .plomien::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 28px;
      left: 11px;
      bottom: 2px;
      border-radius: 50%;
      background: #fff8d8;
    }

    @keyframes miganie {
      from { transform: scale(1) rotate(-3deg); }
      to { transform: scale(1.08) rotate(3deg); }
    }

    .podstawa {
      width: 125px;
      height: 12px;
      margin-top: 5px;
      border-radius: 50%;
      background: #9b7651;
    }

    p {
      max-width: 340px;
      margin: 30px 20px 0;
      font-size: 20px;
      line-height: 1.5;
      color: #e4d2bb;
    }

    small {
      margin-top: 25px;
      color: #a99a89;
    }

    @media (prefers-reduced-motion: reduce) {
      .plomien { animation: none; }
    }
  </style>
</head>
<body>
  <h1>Pamiętamy</h1>

  <div class="znicz" role="img" aria-label="Znicz z płonącym płomieniem">
    <div class="plomien"></div>
  </div>
  <div class="podstawa"></div>

  <p>„Nie umiera ten, kto pozostaje w sercach bliskich.”</p>
  <small>W pamięci o tych, którzy odeszli</small>
</body>
</html>
